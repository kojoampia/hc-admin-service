# The quality gate. Compiles the service and runs the full unit + integration suite.
#
# --- Why this is not part of release.yml -----------------------------------------------------------
#
# release.yml builds the production image and pushes it to GHCR. It deliberately does NOT run the
# tests: the Dockerfile skips them, because the integration tests need Testcontainers and a build
# container has no Docker daemon to give it.
#
# Folding this job into release.yml would mean a failing test leaves the registry with no image for a
# commit that is already on main — the deployment would silently be pinned to an older SHA with no
# way to deploy the current one. Keeping them separate means a red gate is loud and the image still
# exists.
#
# The two run concurrently on the same push. That is intended: the gate reports on the commit, it
# does not guard the build.
#
# --- Testcontainers --------------------------------------------------------------------------------
#
# ubuntu-latest runners ship a working Docker daemon, so `./mvnw verify` runs the *IT classes for
# real. TestContainersSpringContextCustomizerFactory injects the Mongo replica-set URI — and that is
# the ONLY container a run starts.
#
# This comment said "Kafka only starts for classes carrying @EmbeddedKafka" until 2026-09-09, which was
# the third copy of a claim that was true as written and false as read: @IntegrationTest was ITSELF
# annotated @EmbeddedKafka and the customizer resolves it with findMergedAnnotation, so every one of
# the 72 integration tests started a broker. Item 17 then established that nothing had ever used one —
# the three classes that drive a binding all choose the in-memory TestChannelBinderConfiguration — so
# the annotation came off the composite and BrokerOptInArchTest now fails on any class that asks for a
# container. Nothing here starts Kafka. See src/test/resources/META-INF/spring.factories.
#
# Worth knowing before reading a red run on THIS runner rather than on jacserver: the Mongo container
# missing its start window is a jacserver contention problem, not a CI one. Checked across the whole
# retained history on 2026-09-09 — 5 failed runs here, 3 on the gateway — and neither
# ReplicaSetInitializationException nor the readiness timeout appears once.
name: CI

on:
  push:
    branches: [main]

  # --- No `branches:` filter here, and that is item 37 reopening an item 16 decision --------------
  #
  # `pull_request: branches:` matches the pull request's BASE. While this said `[main]`, a stacked
  # pull request — one opened onto another feature branch — matched neither trigger and NO WORKFLOW
  # RAN AT ALL. Measured on gateway PR #53 (base `chore/ci-probe-item-16`, head `c7ab8dfb`): zero
  # check runs, zero workflow runs, `mergeable_state: clean`. GitHub renders that as an ABSENCE of
  # checks, which is indistinguishable from a repository with no CI, so a reviewer approving that
  # diff gets no signal that nothing tested it. hc-patient paid this for real on 2026-09-08: their
  # api PR #39 reported CLEAN for days having run nothing.
  #
  # Item 16 rejected removing this filter on 2026-09-03, because "dropping the `branches` filter
  # spends CI on drafts and spikes". Re-taken 2026-09-09 on measurement, because that cost is not
  # what it sounds like — this filter is the ONLY thing removed, and `push:` above keeps its own:
  #
  #   - Spikes cost nothing. A branch with no pull request open triggers nothing here either way,
  #     because CI runs on no feature-branch push. A spike that HAS a pull request open is a spike
  #     under review, which is exactly the case this change exists to gate.
  #   - Drafts already cost this. `pull_request` fires for a draft today; there is no draft filter in
  #     this file and never has been. Removing a BASE filter changes nothing about them.
  #   - The historical delta is one pull request. Of the 245 ever opened across hc-admin-service,
  #     hc-admin-gateway and hc-admin-app, exactly ONE had a base other than `main` — item 16's own
  #     probe. Runs here are ~5 minutes and `concurrency` below collapses a push storm to one.
  #
  # DO NOT add `if: github.event.pull_request.draft == false` to the job below to "mitigate drafts".
  # It reintroduces item 16's defect on `main`, in green rather than as an absence, and the mechanism
  # is documented rather than suspected. A job skipped by an `if:` still reports a check run, with
  # conclusion `skipped`; GitHub's rule is that required status checks "must have a successful,
  # SKIPPED, or neutral status" to permit a merge. So `Build and test` — required by ruleset
  # 22354479 — would be SATISFIED by a run that tested nothing. Marking the draft ready does not
  # repair it: `ready_for_review` is not one of the default activity types (`opened`, `synchronize`,
  # `reopened`), so no second run happens and the pull request becomes mergeable carrying the draft
  # phase's skip. Anything of that shape needs `types:` widened in step, which is a second thing to
  # keep correct for a cost measured at zero.
  #
  # WHAT THIS DOES NOT DO: the check now RUNS on a stacked pull request, it does not BLOCK one. The
  # ruleset is scoped to `~DEFAULT_BRANCH`, so merging into a feature branch is still a push to an
  # unprotected ref. Do not reach for `~ALL` to close that — item 37 explains at length why it is
  # worse, and this change does not alter the reason: CI still runs on no feature-branch push, so a
  # check required on every ref is a check that never reports on any of them.
  pull_request:

  workflow_dispatch:

concurrency:
  # Supersede an in-flight run for the same ref: only the newest commit's result is interesting.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # 25 is what pom.xml targets and what the deployment runs. The enforcer range is [17,26) here,
      # so a mismatch would not fail the build — it would just test a different runtime than ships.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Verify
        run: ./mvnw -ntp verify --batch-mode

      # Checkstyle carries the nohttp rule, which fails on plaintext http:// URLs in source and
      # config. Run it after the suite so a style failure never masks a real test failure.
      - name: Checkstyle and nohttp
        run: ./mvnw -ntp checkstyle:check --batch-mode

      # --- Formatting, and why it is gated HERE rather than only at pre-commit -----------------
      #
      # Item 66. Until 2026-09-11 nothing in this repository checked Prettier. The only enforcement
      # was .lintstagedrc.cjs, which runs whatever is INSTALLED rather than what package-lock.json
      # PINS — so when node_modules held prettier 3.1.0 against a 3.9.6 pin, the hook quietly
      # enforced the old formatter on every commit, `prettier --check` was never asked, and 136
      # committed files in this repo had drifted from the tool that is supposed to be authoritative
      # for them. Item 18's `npm ci` is what made that visible; nothing in here could have.
      #
      # hc-admin-app is the control and the reason this step exists at all: it is the one of the
      # three repos that gates formatting in CI (through eslint's prettier plugin) and the one that
      # never drifted on either package. Reformatting without adding this step would buy one clean
      # afternoon and re-open on the next stale install.
      #
      # THE GATE IS THE REPO SCRIPT ITSELF, and that is the point rather than a convenience.
      # It used to run a narrower glob than `npm run prettier:check` — Java only — which left
      # .jhipster/*.json, the yml config and every markdown file formatted by the pre-commit hook and
      # checked by nothing. Item 93 widened it; the one file blocking that was admin-api.md, the
      # historical plan doc, and it was reformatted in the same commit.
      #
      # Calling the script rather than repeating its glob is what stops this recurring. Two globs
      # that are meant to be equal are a thing that drifts silently, and the drift is invisible in
      # exactly the direction that matters: the hook goes on formatting a file the gate never checks.
      # One definition, in package.json, read by both.
      #
      # Re-measured at widening time rather than assumed from item 66's day: `npm run prettier:check`
      # over the whole repository failed on admin-api.md ALONE, four weeks after item 66 landed and
      # with .jhipster/*.json and the yml ungated throughout. So widening reddened nothing else.
      #
      # Residual, stated because "the script" reads as "everything" and is not: the glob is
      # {md,json,yml,html,java}, so .lintstagedrc.cjs and
      # src/main/docker/mongodb/scripts/init_replicaset.js are formatted by neither the hook nor this
      # step. That is unchanged by item 93 and is the same on both sides, which is the property worth
      # keeping — widen the script, not this line, if they ever need covering.
      #
      # `npm ci`, not `npm install`: the lockfile is the input, and a gate that resolves different
      # versions than the pre-commit hook is not a gate — it is a second opinion.
      #
      # Placed after Verify and Checkstyle on this file's own rule: a style failure must never mask
      # a real test failure. The cost is that a formatting miss reports at the end of a ~45 minute
      # run, and is not reported at all if the suite is already red. That is the same trade the
      # Checkstyle step above accepts.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install formatting tools
        run: npm ci

      - name: Prettier
        run: npm run prettier:check

      - name: Upload surefire and failsafe reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
