# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

---
# Conditionally disable springdoc on missing api-docs profile
spring:
  config:
    activate:
      on-profile: '!api-docs'
springdoc:
  api-docs:
    enabled: false
---
feign:
  circuitbreaker:
    enabled: true
  # client:
  #   config:
  #     default:
  #       connectTimeout: 5000
  #       readTimeout: 5000
management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - configprops
          - env
          - health
          - info
          - jhimetrics
          - jhiopenapigroups
          - logfile
          - loggers
          - prometheus
          - threaddump
  endpoint:
    health:
      show-details: when_authorized
      roles: 'ROLE_ADMIN'
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    jhimetrics:
      enabled: true
  info:
    git:
      mode: full
    env:
      enabled: true
  health:
    mail:
      enabled: false # When using the MailService, configure an SMTP server and set this to true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 60
  observations:
    key-values:
      application: ${spring.application.name}
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        all: true
      percentiles:
        all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
    data:
      repository:
        autotime:
          enabled: true

mongock:
  migration-scan-package:
    - net.jojoaddison.config.dbmigrations

spring:
  application:
    name: HC-Admin-Service
  cloud:
    consul:
      discovery:
        healthCheckPath: /management/health
        instanceId: hcadminservice:${spring.application.instance-id:${random.value}}
        service-name: hcadminservice
      config:
        watch:
          enabled: false
    function:
      # A function absent from this list is not bound, and nothing says so: the application starts,
      # serves, reports healthy, and subscribes to nothing. That is how this service came to consume
      # no domain events at all — `patient-events` and `hc.professional.registration` were carrying
      # traffic while the only subscription here was to `sse-topic`, its own UI fan-out channel.
      #
      # Deployments that override SPRING_CLOUD_FUNCTION_DEFINITION replace this value entirely rather
      # than adding to it, so a new function has to be added there too. quality/compose.yml and
      # deploy/docker-compose.yml both set it.
      definition: kafkaConsumer;kafkaProducer;patientDirectoryConsumer;professionalDirectoryConsumer
    stream:
      kafka:
        binder:
          replicationFactor: 1
          auto-create-topics: true
          brokers: localhost:9092
        bindings:
          # Read the topic from the beginning the first time this group exists, which is what makes
          # the accounts registered before this consumer shipped visible at all. `resetOffsets: false`
          # is the other half and matters more: with it, startOffset applies only when the group has
          # no committed offset, so a restart resumes where it left off. Setting it true would replay
          # the whole topic on every boot — harmless for the counts, because the write is idempotent,
          # and a growing cost on every deploy for no benefit.
          #
          # enableDlq is the other half of the retry settings below, and the half that decides
          # whether a frame is recoverable. Without it the binder logs and skips once the attempts
          # are exhausted, so a Mongo failover that outlasts them loses every event in the window
          # permanently — /reconcile cannot help, because no link was written to reconcile against.
          # The dlq topic is named for this service, not for the producer: these topics belong to
          # other products and a dead letter of ours must be obviously ours on a shared broker.
          patientDirectoryConsumer-in-0:
            consumer:
              startOffset: earliest
              resetOffsets: false
              enableDlq: true
              dlqName: patient-events.hc-admin-dlq
          professionalDirectoryConsumer-in-0:
            consumer:
              startOffset: earliest
              resetOffsets: false
              enableDlq: true
              dlqName: hc.professional.registration.hc-admin-dlq
      bindings:
        binding-out-0:
          # The destination is the whole point of this binding and it was missing.
          #
          # Without it Spring publishes to a topic named after the binding — `binding-out-0` — while
          # kafkaConsumer-in-0 reads `sse-topic`. Producer and consumer were pointed at different
          # topics, so nothing published through this binding was ever delivered to a browser: the
          # send succeeded, the topic was created, and the message sat in it unread. Both the
          # /publish endpoint and the messageSentEvent go through here.
          destination: sse-topic
          content-type: text/plain
          group: hc-admin-service
        kafkaConsumer-in-0:
          destination: sse-topic
          content-type: text/plain
          group: hc-admin-service
        kafkaProducer-out-0:
          content-type: text/plain
          group: hc-admin-service
        # Verification decisions. Its own destination rather than sse-topic, which is a text/plain
        # UI fan-out channel — a domain event other services subscribe to does not belong in it, and
        # a consumer of one should not have to filter out the other. The decision is also relayed
        # onto sse-topic so the console updates without a reload; that is a second send, not a
        # shared binding.
        #
        # `destination` is not optional and its absence is silent: without it Spring publishes to a
        # topic named after the binding, the send succeeds, and nothing ever reads it. That is
        # exactly what binding-out-0 did above until it was found.
        verification-out-0:
          destination: professional-verification
          content-type: text/plain
          group: hc-admin-service
        # THE TWO DOMAIN SUBSCRIPTIONS. Everything above this line is either outbound or the SSE
        # fan-out; these are the only bindings on which this service learns anything from another.
        #
        # Each names its own group, and neither may be left to inherit one. Without a group Spring
        # Cloud Stream generates an anonymous one per instance, which commits no offsets — a
        # restarted container then resumes at the end of the log and every account created during the
        # deploy is invisible for ever, with nothing logged. And the quality stack sets
        # SPRING_CLOUD_STREAM_DEFAULT_GROUP=hc-admin-service, which applies to any binding that does
        # not name one: inheriting it would put these two in the SSE consumer's group on a shared
        # broker, where they would split partitions and each see part of the traffic.
        #
        # A group per subscriber, not one shared between them, for the same reason hc-professional
        # gives its two consumers of one topic different groups: they are independent readers and
        # each needs its own copy of every event.
        #
        # The retry window is set deliberately and is not the default. DirectoryEventConsumers
        # rethrows anything that fails downstream of the parser — which is a Mongo write, never a bad
        # message, because the parser refuses those without throwing — so these numbers decide how
        # long a partition tolerates the database being away. The binder's default of three attempts
        # with a one-second back-off spans about two seconds, which is shorter than any restart;
        # five attempts from 2s at x3 to a 30s ceiling is roughly ninety, which covers one. Longer
        # than that is an outage rather than a blip, and the dead-letter queue is the answer to it.
        patientDirectoryConsumer-in-0:
          destination: patient-events
          content-type: application/json
          group: hc-admin-directory-patient
          consumer:
            maxAttempts: 5
            backOffInitialInterval: 2000
            backOffMultiplier: 3
            backOffMaxInterval: 30000
        professionalDirectoryConsumer-in-0:
          destination: hc.professional.registration
          content-type: application/json
          group: hc-admin-directory-professional
          consumer:
            maxAttempts: 5
            backOffInitialInterval: 2000
            backOffMultiplier: 3
            backOffMaxInterval: 30000
  profiles:
    # The commented value for `active` can be replaced with valid Spring profiles to load.
    # Otherwise, it will be filled in by maven when building the JAR file
    # Either way, it can be overridden by `--spring.profiles.active` value passed in the commandline or `-Dspring.profiles.active` set in `JAVA_OPTS`
    active: #spring.profiles.active#
    group:
      dev:
        - dev
        - api-docs
        # Uncomment to activate TLS for the dev profile
        #- tls
  jmx:
    enabled: false
  messages:
    basename: i18n/messages
  main:
    allow-bean-definition-overriding: true
  mvc:
    problemdetails:
      enabled: true
  task:
    execution:
      thread-name-prefix: hc-admin-service-task-
      pool:
        core-size: 2
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: hc-admin-service-scheduling-
      pool:
        size: 2
  thymeleaf:
    mode: HTML
  output:
    ansi:
      console-available: true

# Reading the observability stack, for figures no document in Mongo can answer: uptime, whether Kafka
# is carrying connections, whether the databases are healthy.
#
# BLANK BY DEFAULT, AND THAT IS DELIBERATE. Unset means the client is disabled and every one of those
# figures reports as unknown — which is correct for dev, for CI, and for anyone running this without
# a metrics stack. The deployment sets them (see hc-admin-ci's compose.yml); nothing else should need
# to. A wrong URL here is a three-second timeout on a screen someone is waiting for, which is why the
# client's timeouts are short and its failures are silent.
observability:
  mimir:
    url: ${OBSERVABILITY_MIMIR_URL:}
  grafana:
    url: ${OBSERVABILITY_GRAFANA_URL:}

server:
  # Trust the proxy chain when building absolute URLs. Without this, PaginationUtil's `Link` headers
  # are built from the request as this service sees it — which is plain HTTP, on an internal host,
  # and stripped of the gateway's routing prefix. On https://admin.abofonsa.com that produced
  #
  #   <http://admin.abofonsa.com/api/profiles?page=-1&size=20>; rel="last"
  #
  # `http://` on an HTTPS page is mixed content and a browser blocks it, and `/api/...` is the
  # gateway's own surface rather than `/services/hcadminservice/api/...`, so following the link
  # would 404 even if the scheme were right.
  #
  # `framework` registers Spring's ForwardedHeaderFilter, which honours X-Forwarded-Proto, -Host
  # and -Prefix. Do not use `native` — that is for a servlet container doing its own handling, and
  # this runs behind two proxies, not one.
  #
  # This alone is not enough, and the other half is not in this repository. The gateway only emits
  # X-Forwarded-* when `spring.cloud.gateway.server.webflux.trusted-proxies` matches its caller;
  # unset, it strips the headers and sends none, and this property then has nothing to read. If
  # these links ever revert to naming the service's own address, check that first.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true

springdoc:
  show-actuator: true

# Properties to be exposed on the /info management endpoint
info:
  # Comma separated list of profiles that will trigger the ribbon to show
  display-ribbon-on-profiles: 'dev'

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  clientApp:
    name: 'hcAdminServiceApp'
  # By default CORS is disabled. Uncomment to enable.
  # cors:
  #   allowed-origins: "http://localhost:8100,http://localhost:9000"
  #   allowed-methods: "*"
  #   allowed-headers: "*"
  #   exposed-headers: "Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params"
  #   allow-credentials: true
  #   max-age: 1800
  mail:
    from: hcAdminService@localhost
  api-docs:
    default-include-pattern: /api/**
    management-include-pattern: /management/**
    title: Hc Admin Service API
    description: Hc Admin Service API documentation
    version: 0.0.1
    terms-of-service-url:
    contact-name:
    contact-url:
    contact-email:
    license: unlicensed
    license-url:
  # NOTE: there is deliberately no bare `security:` key here.
  #
  # One sat here from the original 2024 JHipster generation, with nothing under it. Spring Boot
  # 4.0.6 ignored it; Boot 4.1 binds it as the empty String and fails, because
  # JHipsterProperties.security is an object and has no String setter:
  #
  #     Failed to bind properties under 'jhipster' to tech.jhipster.config.JHipsterProperties:
  #       Property: jhipster.security
  #       Value: ""
  #       Reason: No setter found for property: security
  #
  # It took the gateway down on the first prod deploy after the Boot 4.1 upgrade. Nothing caught it
  # earlier: the whole test suite runs under the `test` profile against
  # src/test/resources/config/application.yml, so this file's prod-side binding was never exercised.
  # ConfigurationBindingIT now covers it.
  #
  # The empty keys left above (contact-name, license-url and friends) are String-typed, so "" binds
  # cleanly. Emptiness is only fatal where the target is an object.
