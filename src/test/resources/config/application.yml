# ===================================================================
# Spring Boot configuration.
#
# This configuration is used for unit/integration tests.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

mongock:
  migration-scan-package:
    - net.jojoaddison.config.dbmigrations
  mongo-db:
    read-concern: local
    write-concern:
      journal: false
      w: 'majority'

spring:
  application:
    name: hcAdminService
  cloud:
    consul:
      discovery:
        enabled: false
        instanceId: ${spring.application.name}:${spring.application.instance-id:${random.value}}
      config:
        enabled: false
      enabled: false
    function:
      # Kept in step with config/application.yml on purpose: a function missing here is not bound in
      # any test either, so an integration test that sends a frame and asserts a directory row would
      # find nothing and read as a broken projection rather than as a missing subscription.
      definition: kafkaConsumer;kafkaProducer;patientDirectoryConsumer;professionalDirectoryConsumer;professionalProfileConsumer
    stream:
      kafka:
        binder:
          replicationFactor: 1
          auto-create-topics: true
      bindings:
        # binding-out-0 deliberately declares NO destination here, unlike config/application.yml.
        #
        # OutputDestination resolves by destination when a binding has one and by binding name when
        # it does not — and sse-topic is also kafkaConsumer-in-0's destination, so giving this one
        # the real name routes the message to the consumer and the producing tests receive nothing.
        # Setting it "to match production" was tried and broke HcAdminServiceKafkaResourceIT.
        #
        # The shipped destinations are guarded where they can be: ConfigurationBindingTest reads
        # config/application.yml itself, which is the file that actually runs.
        binding-out-0:
          content-type: text/plain
          group: hc-admin-service
        kafkaConsumer-in-0:
          destination: sse-topic
          content-type: text/plain
          group: hc-admin-service
        kafkaProducer-out-0:
          content-type: text/plain
          group: hc-admin-service
        verification-out-0:
          destination: professional-verification
          content-type: text/plain
          group: hc-admin-service
        # These THREE DO declare their real destinations here, unlike binding-out-0 above, and for the
        # mirror-image reason: InputDestination resolves by destination when a binding has one, so
        # naming the shipped topic is what lets a test send to `patient-events` and reach the
        # consumer that would receive it in production. There is no output binding on either topic,
        # so nothing is short-circuited by doing it.
        #
        # maxAttempts: 1 here, where config/application.yml sets 5. The test binder honours the retry
        # settings, so a consumer that throws would be retried across the real back-off — about a
        # minute of it — before a test saw the failure. One attempt makes a rethrow surface at once
        # and be assertable. The shipped numbers are guarded by ConfigurationBindingTest, which reads
        # the other file off disk.
        patientDirectoryConsumer-in-0:
          destination: patient-events
          content-type: application/json
          group: hc-admin-directory-patient
          consumer:
            maxAttempts: 1
        professionalDirectoryConsumer-in-0:
          destination: hc.professional.registration
          content-type: application/json
          group: hc-admin-directory-professional
          consumer:
            maxAttempts: 1
        # Phase 2 of the professional contract, on the api's own topic. Declared here so a test can
        # send a profile status to the destination production would receive it on — the two phases
        # arrive on two topics with no ordering between them, and DirectoryEventConsumptionIT drives
        # them in both orders precisely because neither is the exceptional one.
        professionalProfileConsumer-in-0:
          destination: hc.professional.entity
          content-type: application/json
          group: hc-admin-directory-professional-profile
          consumer:
            maxAttempts: 1
  # No `jackson.serialization: {}` here. Spring Boot 4.1 moved to Jackson 3, whose
  # SerializationFeature lives in tools.jackson.databind, and the empty flow mapping binds as the
  # String "{}" rather than an empty Map — which fails the whole context with a
  # ConverterNotFoundException. It configured nothing to begin with.
  mail:
    host: localhost
  main:
    allow-bean-definition-overriding: true
  messages:
    basename: i18n/messages
  task:
    execution:
      thread-name-prefix: hc-admin-service-task-
      pool:
        core-size: 1
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: hc-admin-service-scheduling-
      pool:
        size: 20
  thymeleaf:
    mode: HTML

server:
  port: 10344
  address: localhost
  # Mirrors the main config. This file replaces it wholesale for tests rather than layering over it,
  # so a property only set there is simply absent here — which is how ForwardedHeadersIT can pass
  # against a service that would not honour the headers in production. Keep the two in step.
  forward-headers-strategy: framework

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================
jhipster:
  clientApp:
    name: 'hcAdminServiceApp'
  mail:
    from: hcAdminService@localhost.com
    base-url: http://127.0.0.1:8080
  logging:
    # To test json console appender
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
  security:
    authentication:
      jwt:
        # This token must be encoded using Base64 (you can type `echo 'secret-key'|base64` on your command line)
        base64-secret: YzQ2ZjY5NzE4MTAwODM3NDM5M2VkY2RmNzNhYjc3NmYzYTNiYmI3YTllODkwZWEzODE3N2VkZTE3NTQ5YTJkYzE1ZDY5YjE1OTYwZWM3NWY2OWU0M2VlYTVmZjM2YTI1ODJiNjA1MWUzZjM4MTllZTcyOGNjZjJhNGZmNTBmOWU=
        # Token is valid 24 hours
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 86400

# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

application:
  professionalservice:
    # OFF for every integration test, deliberately and in the shared config rather than per class.
    #
    # ProfessionalServiceClient writes rounds to hc-professional over HTTP. A test suite that can
    # reach a sibling stack is a suite whose result depends on what is running on the machine, and
    # one that cannot reach it spends a connect timeout per attempt discovering that. Disabled, the
    # client raises RosterServiceNotConfiguredException immediately and nothing here ever opens a
    # socket to another product.
    #
    # It is NOT the outage path, and it stopped being it on 2026-09-06 (backlog item 24). This
    # comment said "the same path an outage takes — so RosterPlanResourceIT exercises the outage
    # state for free", and that was true only because both facts arrived under one reason: the suite
    # had been standing a local misconfiguration in for a far service being down, which is the same
    # substitution the console was making on screen. What the IT exercises for free now is
    # ROSTER_SERVICE_NOT_CONFIGURED — the wire shape is identical, a 200 carrying a per-round
    # failure, and the reason is the honest one. The outage proper is RoundPlanningServiceTest's,
    # over a mocked client, because producing a real one here means a socket and a timeout.
    #
    # The planned path is covered by RoundPlanningServiceTest too, which mocks the client. That split
    # is the honest one: whether a round is really accepted is a question only the running sibling
    # can answer, and it belongs to the quality stack.
    enabled: false
  abofonsa-content:
    # OFF for every integration test, for the same reason and in the same place.
    #
    # AbofonsaContentClient reads web.abofonsa.com, which is a third party's production host. A suite
    # that reaches it is a suite whose result depends on somebody else's deploy, and — worse — a
    # suite that would quietly pass on a machine with no network by taking the very failure path the
    # sync is designed to treat as normal. Disabled, plans() answers Optional.empty() without opening
    # a socket, ServicePlanCatalogueSyncService returns notReached() and writes nothing.
    #
    # ServicePlanCatalogueSyncServiceTest covers both halves over a mocked client, which is the only
    # place the reached path can be exercised without a network. Whether the real catalogue can be
    # read is a question only a running host can answer and belongs to the quality stack.
    #
    # It also stops the @Scheduled refresh doing anything in a booted context, so no test can be
    # raced by a background write to service_plan.
    enabled: false
  patientservice:
    # OFF for every integration test, third of three and for the same reason as the two above.
    #
    # PatientServiceClient asks hc-patient to name a patient this directory learned from an event
    # (backlog item 50). Left enabled, every DirectoryLinkResourceIT case that passes
    # resolveNames=true would open a socket to hc-patient-service:8081 — a name that resolves on a
    # machine running the quality stack and spends a connect timeout per row on one that is not, so
    # the suite's timing and its coverage would both depend on what happens to be up. Disabled, the
    # client answers UNAVAILABLE without dialling.
    #
    # The three outcomes are covered by PatientServiceClientTest against a loopback HTTP server, and
    # the decoration rules by DirectoryNameResolutionServiceTest over a mocked client. What the ITs
    # assert with this off is the shape on the wire: which rows carry an outcome at all, and that no
    # clinical field from hc-patient's 27-field Profile can reach the response.
    enabled: false
management:
  health:
    mail:
      enabled: false
